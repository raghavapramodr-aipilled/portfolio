# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Pretty URLs: /shots instead of /shots.html
[[redirects]]
  from = "/shots"
  to = "/shots.html"
  status = 200
[[redirects]]
  from = "/articles"
  to = "/articles.html"
  status = 200
[[redirects]]
  from = "/music"
  to = "/music.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Images never change once published; CSS/JS are cache-busted with ?v=
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
