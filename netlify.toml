# Static site: every push to main on GitHub publishes the repo root.
# The "build" only drops repo tooling so it isn't served publicly.
[build]
  publish = "."
  command = "rm -f deploy.sh .gitignore"

# Pretty URLs: /shots instead of /shots.html
[[redirects]]
  from = "/shots"
  to = "/shots.html"
  status = 200
[[redirects]]
  from = "/articles"
  to = "/articles.html"
  status = 200
[[redirects]]
  from = "/music"
  to = "/music.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Images never change once published; CSS/JS are cache-busted with ?v=
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
