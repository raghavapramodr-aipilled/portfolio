# Static site: every push to main on GitHub publishes the repo root.
# The "build" only drops repo tooling and the GitHub README so they aren't served publicly.
[build]
  publish = "."
  command = "rm -rf deploy.sh .gitignore README.md screenshots"

# Pretty URLs: /shots instead of /shots.html
[[redirects]]
  from = "/shots"
  to = "/shots.html"
  status = 200
[[redirects]]
  from = "/articles"
  to = "/articles.html"
  status = 200
[[redirects]]
  from = "/music"
  to = "/music.html"
  status = 200
[[redirects]]
  from = "/ai-pill"
  to = "/ai-pill.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Photos never change once published; CSS/JS are cache-busted with ?v=.
# AI Pill screenshots live in /projects instead, so browsers recheck them
# (Netlify's default) and retaken screenshots show up straight away.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
